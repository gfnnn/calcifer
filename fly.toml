# Fly.io deployment for Calcifer. Step-by-step guide: docs/deploy.md.
#
# Change `app` to a name of your own (it must be unique across Fly.io), then:
#   fly apps create <your-app-name>
#   fly volumes create calcifer_data --region lhr --size 1
#   fly secrets set DISCORD_TOKEN=... DISCORD_GUILD_ID=...
#   fly deploy --ha=false
app = "calcifer-fta"
primary_region = "lhr" # London

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/ftabot.db"
  SYNC_INTERVAL_MINUTES = "360"

# The SQLite database lives on this volume and survives deploys and restarts.
[mounts]
  source = "calcifer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A Discord bot holds a connection open and gets no inbound web traffic, so
  # Fly's default "stop when idle" would switch it off. Keep it running.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
