name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. In Discord, use `/...`
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      description: Where did this occur?
      options:
        - Discord bot
        - Web / HTTP API
        - Sync (roster refresh)
        - Calcifer feed hub
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment / context
      description: Deploy target (Railway/Render/local), commit SHA, anything relevant.
    validations:
      required: false
